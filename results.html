<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Voting App - Live Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .results-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 600px;
            max-width: 90%;
            text-align: center;
        }
        h2 { color: #333; }
        .nav-buttons {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="results-container">
        <h2>📊 Live Election Results</h2>
        
        <canvas id="resultsChart"></canvas>

        <div class="nav-buttons">
            <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
            <button onclick="fetchResults()" style="background-color: #28a745;">🔄 Refresh Data</button>
        </div>
    </div>

    <script>
        // Create a variable to hold our chart so we can update it later
        let myChart = null;

        // Function to get data from backend and draw the chart
        async function fetchResults() {
            try {
                // 1. Ask our Python backend for the vote counts
                const response = await fetch('/api/results');
                const data = await response.json();

                // 2. Get the Canvas element from HTML
                const ctx = document.getElementById('resultsChart').getContext('2d');

                // 3. If a chart already exists (like when clicking refresh), destroy it first to prevent overlap
                if (myChart != null) {
                    myChart.destroy();
                }

                // 4. Draw the new Chart!
                myChart = new Chart(ctx, {
                    type: 'bar', // You can change this to 'pie' or 'doughnut' later if you want!
                    data: {
                        labels: data.labels, // ["Ahmed Khan", "Usman Ali"]
                        datasets: [{
                            label: 'Total Votes',
                            data: data.data, // [votes, votes]
                            backgroundColor: [
                                'rgba(54, 162, 235, 0.6)', // Blue for Ahmed
                                'rgba(255, 99, 132, 0.6)'  // Red for Usman
                            ],
                            borderColor: [
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { stepSize: 1 } // Ensure the graph counts by whole numbers (1, 2, 3)
                            }
                        }
                    }
                });

            } catch (error) {
                console.error("Error fetching results:", error);
                alert("Cannot load results. Make sure the server is running!");
            }
        }

        // Automatically load the results when the page opens
        fetchResults();
    </script>
</body>
</html>
