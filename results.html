<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Results – Smart Voting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')})();</script>
<style>
:root{--bg:#f7fafc;--card:#fff;--text:#1a202c;--sub:#4a5568;--border:#e2e8f0;--accent:#2b6cb0;--nav:#1a365d;--sh:rgba(0,0,0,.07)}
[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--text:#e2e8f0;--sub:#a0aec0;--border:#2d3748;--accent:#63b3ed;--nav:#0d1526;--sh:rgba(0,0,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
nav{background:var(--nav);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{color:#fff;font-weight:700;font-size:17px}.nav-r{display:flex;gap:12px;align-items:center}
nav a{color:rgba(255,255,255,.8);text-decoration:none;font-size:13px;font-weight:600}nav a:hover{color:#fff}
.tbtn{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px}
main{flex:1;padding:24px 16px}
.wrap{max-width:680px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 4px 20px var(--sh);margin-bottom:18px}
/* Live banner */
.live-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.live-badge{display:flex;align-items:center;gap:7px;font-weight:700;color:#38a169;font-size:13px}
.dot{width:9px;height:9px;background:#38a169;border-radius:50%;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.upd{font-size:12px;color:var(--sub)}
/* Winner */
.winner-card{background:linear-gradient(135deg,#2b6cb0,#1a365d);color:#fff;border-radius:14px;padding:22px;text-align:center;margin-bottom:18px}
.wlbl{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.wname{font-size:24px;font-weight:700}.wconf{font-size:13px;opacity:.8;margin-top:6px}
/* Turnout */
h3{font-size:15px;font-weight:700;margin-bottom:14px}
.trow{display:flex;justify-content:space-between;margin-bottom:7px}
.tlbl{font-size:13px;font-weight:600}.tpct{font-weight:700;color:var(--accent);font-size:14px}
.pbar{background:var(--border);border-radius:50px;height:13px;overflow:hidden}
.pfill{background:linear-gradient(90deg,#3182ce,#63b3ed);height:100%;border-radius:50px;transition:width 1s ease}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.sbox{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.snum{font-size:22px;font-weight:700;color:var(--accent)}.slbl{font-size:11px;color:var(--sub);margin-top:2px}
/* Candidate bars */
.cand-row{margin-bottom:14px}
.crow-hd{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600}
.cbar-bg{background:var(--border);border-radius:50px;height:10px;overflow:hidden}
.cbar-fill{height:100%;border-radius:50px;transition:width 1.1s ease}
canvas{max-height:260px}
@media(max-width:480px){.stats3{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <span class="logo">📊 Live Results</span>
  <div class="nav-r">
    <a href="index.html">🔐 Login</a>
    <a href="blockchain.html">⛓️ Blockchain</a>
    <button class="tbtn" id="tbtn" onclick="toggleTheme()">🌙</button>
  </div>
</nav>
<main>
  <div class="wrap">
    <div class="card">
      <div class="live-bar">
        <div class="live-badge"><span class="dot"></span> LIVE — Auto-refreshes every 5s</div>
        <div class="upd" id="upd">Loading…</div>
      </div>
    </div>

    <div class="winner-card">
      <div class="wlbl">🏆 Current Leader</div>
      <div class="wname" id="wname">Loading…</div>
      <div class="wconf" id="wconf"></div>
    </div>

    <div class="card">
      <h3>📈 Voter Turnout</h3>
      <div class="trow"><span class="tlbl">Participation Rate</span><span class="tpct" id="tpct">0%</span></div>
      <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
      <div class="stats3">
        <div class="sbox"><div class="snum" id="s1">—</div><div class="slbl">Registered</div></div>
        <div class="sbox"><div class="snum" id="s2" style="color:#38a169">—</div><div class="slbl">Voted</div></div>
        <div class="sbox"><div class="snum" id="s3" style="color:#e53e3e">—</div><div class="slbl">Remaining</div></div>
      </div>
    </div>

    <div class="card">
      <h3>🗳️ Candidate Standings</h3>
      <div id="candBars"></div>
    </div>

    <div class="card"><canvas id="chart"></canvas></div>
  </div>
</main>
<script>
const tbtn=document.getElementById('tbtn');
tbtn.textContent=(localStorage.getItem('theme')||'light')==='dark'?'☀️':'🌙';
function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);tbtn.textContent=n==='dark'?'☀️':'🌙';}

const COLORS=['#63b3ed','#fc8181','#68d391','#f6ad55'];
let chart=null;

async function load(){
  try{
    const r=await fetch('/api/results');const d=await r.json();
    const tot=d.stats.total,voted=d.stats.voted,pct=tot>0?Math.round(voted/tot*100):0;
    const totalVotes=d.data.reduce((a,b)=>a+b,0),maxV=Math.max(...d.data);

    document.getElementById('wname').textContent=d.winner;
    if(totalVotes>0){const c=Math.round(maxV/totalVotes*100);document.getElementById('wconf').textContent=`Leading with ${c}% of votes (${maxV} total)`;}
    else document.getElementById('wconf').textContent='No votes cast yet';

    document.getElementById('tpct').textContent=pct+'%';
    document.getElementById('pfill').style.width=pct+'%';
    document.getElementById('s1').textContent=tot;
    document.getElementById('s2').textContent=voted;
    document.getElementById('s3').textContent=d.stats.left;

    const bars=document.getElementById('candBars');bars.innerHTML='';
    d.labels.forEach((lbl,i)=>{
      const p=totalVotes>0?Math.round(d.data[i]/totalVotes*100):0;
      bars.innerHTML+=`<div class="cand-row">
        <div class="crow-hd"><span>${lbl}</span><span>${d.data[i]} votes (${p}%)</span></div>
        <div class="cbar-bg"><div class="cbar-fill" style="width:${p}%;background:${COLORS[i]}"></div></div>
      </div>`;
    });

    const ctx=document.getElementById('chart').getContext('2d');
    if(chart){chart.data.datasets[0].data=d.data;chart.update('active');}
    else{chart=new Chart(ctx,{type:'doughnut',data:{labels:d.labels,datasets:[{data:d.data,backgroundColor:COLORS,borderWidth:0,hoverOffset:8}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#718096',padding:16,font:{family:'Inter',size:12}}}},animation:{animateRotate:true,duration:900}}});}

    document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString();
  }catch{document.getElementById('upd').textContent='Update failed';}
}
load();setInterval(load,5000);
</script>
</body>
</html>
